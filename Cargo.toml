[package]
name = "guobiao-mahjong-calc"
version = "0.1.0"
edition = "2021"
description = "国标麻将算番器（8番起和 · 听牌算番）"

[lib]
name = "gbmj"
path = "src/lib.rs"

[[bin]]
name = "gbmj"
path = "src/main.rs"

[[bin]]
name = "gbmj-gui"
path = "src/bin/gbmj_gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"], optional = true }

[profile.release]
opt-level = 3
