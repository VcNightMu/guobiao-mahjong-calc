[package]
name = "guobiao-mahjong-calc"
version = "0.1.0"
edition = "2021"
description = "国标麻将算番器（8番起和 · 听牌算番）"

[lib]
name = "gbmj"
path = "src/lib.rs"

[[bin]]
name = "gbmj"
path = "src/main.rs"

[[bin]]
name = "gbmj-gui"
path = "src/bin/gbmj_gui.rs"
required-features = ["gui"]

[features]
# 默认**不**启用 GUI：这样 `cargo build` / `cargo test` 不会拉入 eframe 及其
# 传递依赖（libloading / parking_lot_core / windows-sys 等）。需要 GUI 时必须显式
# 指定 `--features gui`，例如 `cargo build --release --bin gbmj-gui --features gui`。
default = []
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"], optional = true }
